replicaCount: 1

# Empty: chart creates its environment Secret. Otherwise, reference a Secret in
# the release namespace containing the complete runtime environment; env below
# is ignored. External Secret changes require an explicit rollout.
existingSecret: ""

image:
  repository: 1467078763/metapi
  tag: latest
  digest: ""
  pullPolicy: Always

service:
  type: NodePort
  port: 4000
  nodePort: 30400

deployment:
  strategy:
    maxSurge: 1
    maxUnavailable: 0

persistence:
  hostPath: /opt/1panel/docker/compose/metapihub/data

env:
  authToken: ""
  authTokenHash: ""
  # Keep this stable and independent of the administrator password. Optional
  # only for legacy authToken fallback; required for hash-only bootstrap.
  accountCredentialSecret: ""
  adminSessionTtlMs: "43200000"
  adminSessionTouchIntervalMs: "300000"
  dbType: postgres
  dbUrl: ""
  dbSsl: "false"
  dataDir: /app/data
  port: "4000"
  tz: Asia/Shanghai
  checkinCron: "0 8 * * *"
  balanceRefreshCron: "0 * * * *"
  deployHelperToken: ""
