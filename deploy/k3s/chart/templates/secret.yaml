{{- if not .Values.existingSecret -}}
{{- if not (or (trim .Values.env.authToken) (trim .Values.env.authTokenHash)) -}}
{{- fail "env.authToken or env.authTokenHash is required for chart-managed bootstrap" -}}
{{- end -}}
{{- if and (not (trim .Values.env.authToken)) (not (trim .Values.env.accountCredentialSecret)) -}}
{{- fail "env.accountCredentialSecret is required for hash-only bootstrap" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "metapi.envSecretName" . }}
  labels:
    {{- include "metapi.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_CREDENTIAL_BOOTSTRAP_REQUIRED: "true"
  {{- if .Values.env.authToken }}
  AUTH_TOKEN: {{ .Values.env.authToken | quote }}
  {{- end }}
  {{- if .Values.env.authTokenHash }}
  AUTH_TOKEN_HASH: {{ .Values.env.authTokenHash | quote }}
  {{- end }}
  {{- if .Values.env.accountCredentialSecret }}
  ACCOUNT_CREDENTIAL_SECRET: {{ .Values.env.accountCredentialSecret | quote }}
  {{- end }}
  ADMIN_SESSION_TTL_MS: {{ .Values.env.adminSessionTtlMs | quote }}
  ADMIN_SESSION_TOUCH_INTERVAL_MS: {{ .Values.env.adminSessionTouchIntervalMs | quote }}
  DB_TYPE: {{ .Values.env.dbType | quote }}
  {{- if eq (lower (toString .Values.env.dbType)) "sqlite" }}
  DB_URL: {{ default "./data/hub.db" .Values.env.dbUrl | quote }}
  {{- else }}
  DB_URL: {{ required "env.dbUrl is required when env.dbType is mysql/postgres" .Values.env.dbUrl | quote }}
  {{- end }}
  DB_SSL: {{ .Values.env.dbSsl | quote }}
  DATA_DIR: {{ .Values.env.dataDir | quote }}
  PORT: {{ .Values.env.port | quote }}
  TZ: {{ .Values.env.tz | quote }}
  CHECKIN_CRON: {{ .Values.env.checkinCron | quote }}
  BALANCE_REFRESH_CRON: {{ .Values.env.balanceRefreshCron | quote }}
  DEPLOY_HELPER_TOKEN: {{ .Values.env.deployHelperToken | quote }}
{{- end }}
