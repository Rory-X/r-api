services:
  r-api:
    image: 1467078763/metapi:latest
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./data:/app/data
    environment:
      DEMO_MODE: ${DEMO_MODE:-false}
      ACCOUNT_CREDENTIAL_SECRET: ${ACCOUNT_CREDENTIAL_SECRET:?ACCOUNT_CREDENTIAL_SECRET is required}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      AUTH_TOKEN_HASH: ${AUTH_TOKEN_HASH:-}
      ADMIN_CREDENTIAL_BOOTSTRAP_REQUIRED: "true"
      ADMIN_SESSION_TTL_MS: ${ADMIN_SESSION_TTL_MS:-43200000}
      ADMIN_SESSION_TOUCH_INTERVAL_MS: ${ADMIN_SESSION_TOUCH_INTERVAL_MS:-300000}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      UPSTREAM_HTTP2_ENABLED: ${UPSTREAM_HTTP2_ENABLED:-true}
      UPSTREAM_HTTP_CONNECTIONS_PER_ORIGIN: ${UPSTREAM_HTTP_CONNECTIONS_PER_ORIGIN:-100}
      UPSTREAM_HTTP_KEEP_ALIVE_TIMEOUT_MS: ${UPSTREAM_HTTP_KEEP_ALIVE_TIMEOUT_MS:-90000}
      UPSTREAM_HTTP_KEEP_ALIVE_MAX_TIMEOUT_MS: ${UPSTREAM_HTTP_KEEP_ALIVE_MAX_TIMEOUT_MS:-600000}
      UPSTREAM_HTTP_AUTO_SELECT_FAMILY: ${UPSTREAM_HTTP_AUTO_SELECT_FAMILY:-true}
      UPSTREAM_HTTP_AUTO_SELECT_FAMILY_ATTEMPT_TIMEOUT_MS: ${UPSTREAM_HTTP_AUTO_SELECT_FAMILY_ATTEMPT_TIMEOUT_MS:-250}
      MODEL_AVAILABILITY_PROBE_ENABLED: ${MODEL_AVAILABILITY_PROBE_ENABLED:-false}
      CHANNEL_RECOVERY_PROBE_ENABLED: ${CHANNEL_RECOVERY_PROBE_ENABLED:-false}
      CHECKIN_CRON: "0 8 * * *"
      BALANCE_REFRESH_CRON: "0 * * * *"
      PORT: ${PORT:-4000}
      DATA_DIR: /app/data
      TZ: ${TZ:-Asia/Shanghai}
    restart: unless-stopped
